# DaisyCap share links, included in the jaeswift.xyz TLS server block.
# Installed as /etc/nginx/snippets/daisycap-share.conf by deploy.sh.
#
#   /daisycap/api/share/{handle,upload,delete}.php  the share API (POST)
#   /daisycap/<handle>/<video>                       the page for a shared video
#   /daisycap/<handle>/<video>/video.mp4|gif|jpg     the files themselves
#
# Nothing else under /daisycap/ changes: WordPress keeps its own pages.

location ~ ^/daisycap/api/share/(handle|upload|delete)\.php$ {
    limit_req zone=daisycap_share burst=10 nodelay;
    client_max_body_size 1100m;
    client_body_timeout 900s;
    fastcgi_read_timeout 900s;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /opt/daisycap-share/$1.php;
}

location ~ ^/daisycap/([a-z0-9-]+)/([a-z0-9-]+)/?$ {
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /opt/daisycap-share/view.php;
    fastcgi_param SHARE_HANDLE $1;
    fastcgi_param SHARE_SLUG $2;
}

location ~ ^/daisycap/([a-z0-9-]+)/([a-z0-9-]+)/(video\.mp4|video\.gif|poster\.jpg)$ {
    alias /var/lib/daisycap-share/files/$1/$2/$3;
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options nosniff;
}
