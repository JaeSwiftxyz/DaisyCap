# The DaisyCap page at jaeswift.xyz/tools/daisycap/. Included in the jaeswift.xyz TLS server block
# after the download routes. Installed by server/tools-daisycap/deploy.sh.

location = /tools/daisycap {
    return 301 /tools/daisycap/;
}

location ^~ /tools/daisycap/ {
    alias /var/www/daisycap-tools/;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
