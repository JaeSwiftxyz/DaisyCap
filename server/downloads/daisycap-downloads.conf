# DaisyCap downloads, included in the jaeswift.xyz TLS server block after the share routes.
# Installed by server/downloads/deploy.sh.
#
#   /daisycap/releases/latest/download/DaisyCap.dmg   the link on the download page
#   /daisycap/downloads/<file>                         each version's DMG
#
# The update feed (/daisycap/appcast.xml) isn't served. Updates are manual for now.

location = /daisycap/releases/latest/download/DaisyCap.dmg {
    alias /var/lib/daisycap-downloads/DaisyCap.dmg;
    types { application/x-apple-diskimage dmg; }
    default_type application/x-apple-diskimage;
    add_header Content-Disposition "attachment; filename=DaisyCap.dmg" always;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}

location ^~ /daisycap/downloads/ {
    alias /var/lib/daisycap-downloads/;
    autoindex off;
    types { application/x-apple-diskimage dmg; }
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options nosniff always;
}
